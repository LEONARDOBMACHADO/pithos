[workspace]
resolver = "2"
members = [
    "crates/pithos-core",
    "crates/pithos-format",
    "crates/pithos-io",
    "crates/pithos-codecs",
    "crates/pithos-analysis",
    "crates/pithos-transforms",
    "crates/pithos-recompress",
    "crates/pithos-planner",
    "crates/pithos-native-codec",
    "crates/pithos-native-codec-v2",
    "crates/pithos-native-codec-v3",
    "crates/pithos-native-codec-v4",
    "crates/pithos-native-codec-v5",
    "crates/pithos-native-codec-v6",
    "crates/pithos-native-codec-v7",
    "crates/pithos-native-codec-v8",
    "crates/pithos-native-codec-v9",
    "crates/pithos-native-codec-v10",
    "crates/pithos-native-codec-v11",
    "crates/pithos-engine",
    "crates/pithos-engine-next",
    "crates/pithos-agent-api",
    "crates/pithos-daemon",
    "crates/pithos-cli",
    "crates/pithos-testkit",
    "crates/pithos-telemetry",
    "crates/pithos-bench",
    "crates/pithos-viewer",
    "crates/pithos-mount",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["LEONARDOBMACHADO"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LEONARDOBMACHADO/pithos"

[workspace.dependencies]
blake3 = "1.5"
crc32c = "0.6"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
crossbeam-channel = "0.5"
tempfile = "3.12"
bytes = "1.7"
parking_lot = "0.12"
rand = "0.9"
memmap2 = "0.9"
zstd = "0.13"
brotli = "7.0"
liblzma = { version = "0.4", features = ["parallel"] }
flate2 = "1.0"
clap = { version = "4.5", features = ["derive"] }
proptest = "1.5"
same-file = "1.0"
fastcdc = "=4.0.1"
smallvec = "1.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
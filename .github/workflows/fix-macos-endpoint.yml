name: Apply macOS Endpoint Fix

on:
  push:
    branches:
      - "feat/phase3-exact-dedup"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/phase3-exact-dedup

      - name: Patch endpoint normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/pithos-daemon/src/transport.rs")
          text = path.read_text()
          old = '''fn normalize_state_dir(path: PathBuf) -> PathBuf {
              let resolved = std::fs::canonicalize(&path)
                  .or_else(|_| std::path::absolute(&path).map(lexically_normalize_absolute))
                  .unwrap_or(path);
              stable_state_dir_path(resolved)
          }
          '''
          new = '''fn normalize_state_dir(path: PathBuf) -> PathBuf {
              let absolute = std::path::absolute(&path)
                  .map(lexically_normalize_absolute)
                  .unwrap_or(path);
              let resolved = canonicalize_with_missing_tail(&absolute).unwrap_or(absolute);
              stable_state_dir_path(resolved)
          }

          fn canonicalize_with_missing_tail(path: &std::path::Path) -> io::Result<PathBuf> {
              let mut current = path;
              let mut missing = Vec::new();
              loop {
                  match std::fs::canonicalize(current) {
                      Ok(mut resolved) => {
                          for component in missing.iter().rev() {
                              resolved.push(component);
                          }
                          return Ok(resolved);
                      }
                      Err(error) if error.kind() == io::ErrorKind::NotFound => {
                          let Some(component) = current.file_name() else {
                              return Err(error);
                          };
                          missing.push(component.to_os_string());
                          let Some(parent) = current.parent() else {
                              return Err(error);
                          };
                          current = parent;
                      }
                      Err(error) => return Err(error),
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit("expected normalize_state_dir block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install Rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/pithos-daemon/src/transport.rs
          git commit -m "fix: canonicalize missing IPC state directory tails"
          git push origin HEAD:feat/phase3-exact-dedup

name: Apply Rustfmt Phase3

on:
  push:
    branches:
      - "feat/phase3-exact-dedup"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/phase3-exact-dedup

      - name: Install Rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply Rustfmt
        run: cargo fmt --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt to exact dedup"
          git push origin HEAD:feat/phase3-exact-dedup

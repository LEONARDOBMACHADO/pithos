name: Pithos CI (manual only)

# Automatic GitHub Actions validation is intentionally disabled.
# Validation commands must be run locally and evidence committed under docs/gates/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic CI disabled; run validation locally and commit evidence."

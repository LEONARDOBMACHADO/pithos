name: Pithos CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

concurrency:
  group: pithos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage gate
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 80

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

  gate-c3-fuzz:
    name: Gate C3 exact dedup fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build exact dedup fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bin exact_dedup

      - name: Fuzz exact dedup
        run: cargo fuzz run exact_dedup --manifest-path fuzz/Cargo.toml -- -runs=10000 -max_len=65536

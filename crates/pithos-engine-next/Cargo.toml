[package]
name = "pithos-engine-next"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
# Historical pack/verify implementations are preserved for research and
# regression archaeology, but are not part of the active production dispatch.
# Keeping them behind an explicit feature avoids masking dead-code debt in the
# active engine while retaining the source for future experiments.
legacy-experiments = []

[dependencies]
pithos-engine-legacy = { package = "pithos-engine", path = "../pithos-engine" }
pithos-core = { path = "../pithos-core" }
pithos-format = { path = "../pithos-format" }
pithos-codecs = { path = "../pithos-codecs" }
pithos-analysis = { path = "../pithos-analysis" }
pithos-io = { path = "../pithos-io" }
pithos-planner = { path = "../pithos-planner" }
pithos-native-codec = { package = "pithos-native-codec-v18", path = "../pithos-native-codec-v18" }
blake3.workspace = true
crc32c.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
rayon.workspace = true

[dev-dependencies]
tempfile.workspace = true